<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
   <script src="script.js"></script>
  <title>Admission Inquiry Form</title>
</head>
<body>

  <h1 id="admissionsform">Admission Form</h1>

  <form action="submit" method="post">
   
    <!-- Full Name -->
    <label for="name">Full Name:</label><br>
    <input type="text"  required> <br><br>

    <!-- Email -->
    <label for="email">Email:</label><br>
    <input type="email"  required><br><br>

    <!-- Phone -->
    <label for="phone">Phone Number:</label><br>
    <input type="tel"><br><br>

    <!-- Grade Applying For -->
     
    <label for="grade">Grade Applying For:</label><br>
    <select ">
      <option value="nursery">Nursery</option>
      <option value="kg">Kindergarten</option>
      <option value="1">Class 1</option>
      <option value="2">Class 2</option>
      <option value="4">Class 3</option>
      <option value="5">Class 4</option>
      <option value="6">Class 5</option>
      <option value="7">Class 6</option>
    </select><br><br>

    <!-- Message -->
      <label for="message">Your Message:</label>
      <textarea id="message" name="message" rows="5"></textarea>
 <!-- Submit Button -->
      <input type="submit" value="Submit">
      <div class="thank-you-message" id="thankYouMessage">
        🎉 Thank you! Your admission inquiry has been submitted successfully.
      </div>

  </form>

</body>
</html>
